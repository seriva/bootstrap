name: CI/CD

on:
  push:
    branches: [main, master]
  # No branch filter: phase PRs target feat/<plan-slug> (and release PRs may
  # target version branches), so every PR gets a check run without running CI
  # twice on branch pushes or triggering deploy jobs on feature branches.
  pull_request:
  # Uncomment as needed:
  # release:
  #   types: [published]
  # workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Replace this block with your runtime setup, e.g.:
      #
      # - name: Setup runtime
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: "25.x"
      #     cache: "npm"
      #
      # - name: Setup runtime
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #
      # - name: Setup runtime
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: "1.22"

      - name: Install dependencies
        # Examples:
        #   run: npm install
        #   run: pip install -r requirements.txt
        #   run: go mod download
        run: "[INSTALL_COMMAND]"

      # Runs the same format → lint → test gate as the pre-commit hook, so commands
      # live only in lefthook.yml. Secret scanning stays local (needs staged files).
      - name: Quality gate
        env:
          LEFTHOOK_EXCLUDE: secrets
        run: npx --yes lefthook run pre-commit --all-files

      - name: Fail on unformatted files
        run: git diff --exit-code HEAD  # HEAD: stage_fixed may have staged the fixes

