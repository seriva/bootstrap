name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Uncomment as needed:
  # release:
  #   types: [published]
  # workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Replace this block with your runtime setup, e.g.:
      #
      # - name: Setup runtime
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: "25.x"
      #     cache: "npm"
      #
      # - name: Setup runtime
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #
      # - name: Setup runtime
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: "1.22"

      - name: Install dependencies
        # Examples:
        #   run: npm install
        #   run: pip install -r requirements.txt
        #   run: go mod download
        run: "[INSTALL_COMMAND]"

      - name: Lint
        # Examples:
        #   run: npm run check
        #   run: ruff check .
        #   run: golangci-lint run
        #   run: cargo clippy
        run: "[LINT_COMMAND]"

      - name: Test
        # Examples:
        #   run: npm test
        #   run: pytest
        #   run: go test ./...
        #   run: cargo test
        run: "[TEST_COMMAND]"

